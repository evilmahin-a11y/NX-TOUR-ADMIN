<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            color: #ff3b3f;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #2a2a2a;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #ccc;
        }

        .card h3 i {
            margin-right: 5px;
            color: #ff3b3f;
        }

        .card button {
            background-color: #ff3b3f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }

        .card button:hover {
            background-color: #e03235;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Admin Control Panel</h1>
    </div>

    <div class="grid-container">
        <div class="card">
            <h3><i class="fa-solid fa-circle-info"></i> App Info</h3>
            <button onclick="navigateTo('app_info.html')">Manage</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-gamepad"></i> Matches</h3>
            <button onclick="navigateTo('matches.html')">Add / Edit</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-wallet"></i> Add Money</h3>
            <button onclick="navigateTo('add_money.html')">Requests</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-users"></i> Users</h3>
            <button onclick="navigateTo('users.html')">View All</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-layer-group"></i> Categories</h3>
            <button onclick="navigateTo('categories.html')">Update Images</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-money-bill-transfer"></i> Withdrawal</h3>
            <button onclick="navigateTo('withdrawal.html')">Manage</button>
        </div>
    </div>

    <script>
        function navigateTo(pageUrl) {
            window.location.href = pageUrl;
        }
    </script>

</body>
</html>
